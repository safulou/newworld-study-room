<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewWorld Study Room</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0f1622;
      --bg-2: #162234;
      --panel: #18263a;
      --panel-2: #213149;
      --line: #32465f;
      --text: #ecf2f7;
      --muted: #9dadbd;
      --faint: #6f8295;
      --lamp: #f0b35d;
      --lamp-soft: #ffe1a7;
      --aqua: #68c7bd;
      --leaf: #7db36d;
      --paper: #f3e2b8;
      --paper-rose: #efc9bb;
      --ink: #312719;
      --danger: #db8c7d;
      --shadow: rgba(3, 8, 16, .38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background:
        radial-gradient(circle at 18% 6%, rgba(104, 199, 189, .16), transparent 26rem),
        linear-gradient(180deg, #0d1420 0%, var(--bg) 48%, #111b27 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.55;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1220px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 18px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0;
      line-height: 1;
    }

    .room-code {
      min-height: 30px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(24, 38, 58, .66);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      white-space: nowrap;
    }

    .presence {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--aqua);
      box-shadow: 0 0 14px rgba(104, 199, 189, .9);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      align-items: start;
    }

    .stage {
      position: relative;
      min-height: 610px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(18, 28, 42, .45), rgba(13, 18, 29, .95)),
        repeating-linear-gradient(90deg, transparent 0 72px, rgba(255, 255, 255, .018) 72px 73px);
      box-shadow: 0 22px 48px var(--shadow);
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: .7;
      background-image:
        radial-gradient(circle at 12% 18%, #dfe8f5 0 1px, transparent 2px),
        radial-gradient(circle at 28% 10%, #dfe8f5 0 1px, transparent 2px),
        radial-gradient(circle at 78% 16%, #dfe8f5 0 1px, transparent 2px),
        radial-gradient(circle at 86% 31%, #dfe8f5 0 1px, transparent 2px),
        radial-gradient(circle at 45% 24%, #dfe8f5 0 1px, transparent 2px);
    }

    .room-3d {
      position: absolute;
      left: 50%;
      bottom: 74px;
      width: min(650px, 88%);
      aspect-ratio: 1.18 / 1;
      transform: translateX(-50%);
      perspective: 900px;
    }

    .cabin-roof {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 4;
      width: 88%;
      height: 32%;
      transform: translateX(-50%);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background:
        repeating-linear-gradient(115deg, rgba(255, 255, 255, .08) 0 2px, transparent 2px 18px),
        linear-gradient(180deg, #7a452d, #4d2f24);
      border: 1px solid rgba(255, 225, 167, .24);
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .34));
    }

    .cabin-sign {
      position: absolute;
      left: 50%;
      top: 18%;
      z-index: 8;
      min-width: 148px;
      padding: 7px 12px;
      border: 1px solid rgba(255, 225, 167, .35);
      border-radius: 6px;
      color: var(--lamp-soft);
      background: rgba(62, 43, 30, .9);
      text-align: center;
      transform: translateX(-50%) rotate(-1deg);
      box-shadow: 0 10px 18px rgba(0, 0, 0, .25);
    }

    .room-box {
      position: absolute;
      inset: 24% 8% 7%;
      transform-style: preserve-3d;
      border: 4px solid #5a3828;
      border-radius: 7px;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .04), transparent 18%, rgba(255, 255, 255, .04)),
        repeating-linear-gradient(0deg, #644530 0 28px, #583b2b 28px 31px);
      box-shadow: inset 0 0 0 8px rgba(28, 18, 13, .18), 0 30px 44px rgba(0, 0, 0, .34);
    }

    .room-box::before,
    .room-box::after {
      content: "";
      position: absolute;
      z-index: 3;
      background: linear-gradient(180deg, #795238, #4b3125);
      box-shadow: 0 0 0 1px rgba(255, 225, 167, .12);
    }

    .room-box::before {
      left: 50%;
      top: 0;
      width: 12px;
      height: 100%;
      transform: translateX(-50%);
    }

    .room-box::after {
      left: 0;
      bottom: 27%;
      width: 100%;
      height: 12px;
    }

    .floor {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 0;
      height: 31%;
      border: 1px solid rgba(255, 225, 167, .22);
      border-radius: 0 0 6px 6px;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .08) 0 1px, transparent 1px 42px),
        linear-gradient(135deg, #7e5a3f, #4d372b);
      clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
      box-shadow: 0 -18px 30px rgba(0, 0, 0, .14) inset;
    }

    .wall {
      position: absolute;
      border: 1px solid rgba(255, 225, 167, .16);
      background: rgba(45, 31, 24, .14);
    }

    .wall.back {
      left: 5%;
      top: 7%;
      width: 58%;
      height: 52%;
    }

    .wall.side {
      right: 5%;
      top: 7%;
      width: 26%;
      height: 52%;
      background:
        repeating-linear-gradient(0deg, #553b2c 0 22px, #493126 22px 25px);
    }

    .window {
      position: absolute;
      left: 20%;
      top: 18%;
      width: 28%;
      height: 34%;
      border: 3px solid #5f7892;
      border-radius: 5px;
      background: #101927;
      box-shadow: inset 0 0 28px rgba(104, 199, 189, .12);
    }

    .window::before,
    .window::after {
      content: "";
      position: absolute;
      background: #5f7892;
    }

    .window::before {
      left: 50%;
      top: 0;
      width: 3px;
      height: 100%;
    }

    .window::after {
      left: 0;
      top: 50%;
      width: 100%;
      height: 3px;
    }

    .furniture {
      position: absolute;
      transform-style: preserve-3d;
      filter: drop-shadow(0 12px 10px rgba(0, 0, 0, .2));
      z-index: 5;
    }

    .desk {
      left: 15%;
      top: 54%;
      width: 168px;
      height: 88px;
    }

    .desk::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 18px;
      width: 150px;
      height: 22px;
      border-radius: 6px;
      background: #8d6745;
    }

    .desk::after {
      content: "";
      position: absolute;
      left: 96px;
      bottom: 42px;
      width: 44px;
      height: 30px;
      border-radius: 5px;
      background: #111925;
      border: 2px solid #6a8095;
      box-shadow: 0 0 26px rgba(104, 199, 189, .3);
    }

    .lamp {
      left: 32%;
      top: 44%;
      width: 58px;
      height: 100px;
    }

    .lamp::before {
      content: "";
      position: absolute;
      left: 26px;
      top: 32px;
      width: 6px;
      height: 60px;
      background: #6b563d;
    }

    .lamp::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 12px;
      width: 42px;
      height: 28px;
      clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
      background: var(--lamp);
      box-shadow: 0 0 44px rgba(240, 179, 93, .8);
    }

    .bookshelf {
      right: 12%;
      top: 22%;
      width: 92px;
      height: 150px;
      border-radius: 5px;
      background: #6f5037;
      padding: 12px 9px;
      display: grid;
      gap: 8px;
    }

    .shelf-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: end;
      gap: 4px;
      border-bottom: 3px solid #503a2b;
    }

    .shelf-row span {
      display: block;
      min-height: 18px;
      border-radius: 2px 2px 0 0;
      background: var(--lamp);
    }

    .shelf-row span:nth-child(2n) {
      min-height: 26px;
      background: var(--aqua);
    }

    .shelf-row span:nth-child(3n) {
      min-height: 22px;
      background: var(--danger);
    }

    .plant {
      right: 8%;
      bottom: 14%;
      width: 78px;
      height: 108px;
    }

    .plant::before {
      content: "";
      position: absolute;
      left: 24px;
      bottom: 0;
      width: 34px;
      height: 30px;
      clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%);
      background: #8c684a;
    }

    .plant::after {
      content: "";
      position: absolute;
      left: 8px;
      bottom: 26px;
      width: 62px;
      height: 78px;
      background: var(--leaf);
      clip-path: polygon(50% 0, 64% 34%, 100% 24%, 73% 53%, 94% 84%, 56% 70%, 35% 100%, 34% 64%, 0 72%, 24% 42%, 6% 12%, 39% 29%);
    }

    .avatar-zone {
      position: absolute;
      left: 50%;
      bottom: 96px;
      width: 220px;
      height: 250px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      z-index: 5;
    }

    .doll-canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      filter: drop-shadow(0 16px 14px rgba(0, 0, 0, .24));
    }

    .doll-canvas:active {
      cursor: grabbing;
    }

    .avatar-zone.viewer-ready .avatar {
      opacity: 0;
      pointer-events: none;
    }

    .avatar {
      position: relative;
      width: 132px;
      height: 170px;
      display: grid;
      place-items: center;
      animation: breathe 3.6s ease-in-out infinite;
      transition: opacity .25s ease;
    }

    .avatar::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: -10px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .26);
      filter: blur(2px);
    }

    .avatar-body {
      position: absolute;
      left: 24px;
      bottom: 0;
      width: 84px;
      height: 108px;
      border-radius: 48px 48px 26px 26px;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 255, 255, .28), transparent 25%),
        linear-gradient(180deg, #76c8bd, #4f909d);
      border: 2px solid rgba(255, 255, 255, .16);
      box-shadow: inset -10px -16px 20px rgba(0, 0, 0, .16);
    }

    .avatar-face,
    .avatar-photo {
      position: absolute;
      left: 20px;
      top: 4px;
      width: 92px;
      height: 92px;
      border: 4px solid #d8c29d;
      border-radius: 50%;
      background: #f2d7b6;
      overflow: hidden;
      box-shadow: 0 12px 26px rgba(0, 0, 0, .22);
    }

    .avatar-face::before,
    .avatar-face::after {
      content: "";
      position: absolute;
      top: 42px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2f261f;
    }

    .avatar-face::before {
      left: 28px;
    }

    .avatar-face::after {
      right: 28px;
    }

    .avatar-smile {
      position: absolute;
      left: 39px;
      top: 56px;
      width: 18px;
      height: 9px;
      border-bottom: 3px solid #2f261f;
      border-radius: 0 0 16px 16px;
    }

    .avatar-photo {
      display: none;
      object-fit: cover;
    }

    .avatar.has-photo .avatar-face {
      display: none;
    }

    .avatar.has-photo .avatar-photo {
      display: block;
    }

    .avatar.generated .avatar-body {
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .36), transparent 24%),
        linear-gradient(180deg, #f0b35d, #68c7bd 72%, #477c92);
    }

    .avatar.generating {
      animation: breathe 1.1s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(240, 179, 93, .34));
    }

    .focus-pill {
      position: absolute;
      left: 18px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 225, 167, .22);
      border-radius: 8px;
      background: rgba(13, 20, 32, .78);
      backdrop-filter: blur(10px);
    }

    .timer {
      min-width: 74px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 21px;
      color: var(--lamp-soft);
    }

    .icon-btn,
    .text-btn {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: var(--panel-2);
    }

    .icon-btn {
      width: 38px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .text-btn {
      padding: 0 12px;
      white-space: nowrap;
    }

    .primary {
      border-color: rgba(240, 179, 93, .68);
      color: #241604;
      background: var(--lamp);
    }

    .side {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 38, 58, .9);
      box-shadow: 0 16px 32px rgba(0, 0, 0, .16);
      padding: 14px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .panel-title {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .upload {
      display: grid;
      gap: 10px;
    }

    .drop {
      display: grid;
      place-items: center;
      min-height: 112px;
      padding: 16px;
      border: 1px dashed #57718c;
      border-radius: 8px;
      color: var(--muted);
      background: #142033;
      text-align: center;
    }

    .drop input {
      width: 100%;
      max-width: 220px;
      color: var(--muted);
    }

    .status-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 13px;
    }

    .generation-card {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(255, 225, 167, .18);
      border-radius: 7px;
      background: #121d2e;
    }

    .generation-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: #0c1422;
    }

    .progress span {
      display: block;
      width: var(--progress, 8%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--lamp), var(--aqua));
      transition: width .35s ease;
    }

    .status-list li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: center;
    }

    .check {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #112118;
      background: var(--leaf);
      font-size: 12px;
      font-weight: 800;
    }

    .notes {
      display: grid;
      gap: 9px;
      max-height: 238px;
      overflow: auto;
      padding-right: 2px;
    }

    .note {
      padding: 9px 10px;
      border-radius: 4px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 3px 0 rgba(0, 0, 0, .18);
      transform: rotate(-.4deg);
    }

    .note:nth-child(even) {
      background: var(--paper-rose);
      transform: rotate(.5deg);
    }

    .note b {
      display: block;
      margin-bottom: 2px;
      color: rgba(49, 39, 25, .68);
      font-size: 12px;
    }

    .note-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 10px;
    }

    .note-form input,
    .invite-row input,
    .settings input {
      min-width: 0;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: #121d2e;
      padding: 0 10px;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 104px;
      gap: 8px;
    }

    .invite-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 8px;
    }

    .roadmap {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 13px;
    }

    .roadmap li {
      padding-left: 13px;
      border-left: 3px solid var(--line);
    }

    .roadmap .now {
      color: var(--text);
      border-color: var(--lamp);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 32px));
      padding: 10px 14px;
      border: 1px solid rgba(255, 225, 167, .24);
      border-radius: 8px;
      color: var(--lamp-soft);
      background: rgba(13, 20, 32, .92);
      box-shadow: 0 18px 36px rgba(0, 0, 0, .3);
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @keyframes breathe {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @media (max-width: 940px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 560px;
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100vw - 20px, 1220px);
        padding-top: 14px;
      }

      .topbar,
      .brand,
      .settings,
      .invite-row {
        grid-template-columns: 1fr;
      }

      .brand {
        display: grid;
      }

      .presence {
        justify-content: flex-start;
      }

      .stage {
        min-height: 510px;
      }

      .room-3d {
        width: 96%;
        bottom: 92px;
      }

      .focus-pill {
        right: 12px;
        left: 12px;
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>NewWorld Study Room</h1>
        <span class="room-code" id="roomCode">room://midnight-0427</span>
      </div>
      <div class="presence"><span class="dot"></span><span id="presenceText">3 位同伴安靜在線</span></div>
    </header>

    <section class="shell" aria-label="伴讀房 MVP">
      <div class="stage">
        <div class="stars" aria-hidden="true"></div>
        <div class="room-3d" aria-label="3D 伴讀房">
          <div class="cabin-roof" aria-hidden="true"></div>
          <div class="cabin-sign">小木屋伴讀中</div>
          <div class="room-box">
            <div class="wall back"><div class="window"></div></div>
            <div class="wall side"></div>
            <div class="floor"></div>
            <div class="furniture desk"></div>
            <div class="furniture lamp"></div>
            <div class="furniture bookshelf">
              <div class="shelf-row"><span></span><span></span><span></span><span></span><span></span></div>
              <div class="shelf-row"><span></span><span></span><span></span><span></span><span></span></div>
              <div class="shelf-row"><span></span><span></span><span></span><span></span><span></span></div>
            </div>
            <div class="furniture plant"></div>
          </div>
        </div>

        <div class="avatar-zone">
          <canvas class="doll-canvas" id="dollCanvas" aria-label="可旋轉的 3D 伴讀娃娃"></canvas>
          <div class="avatar" id="avatar">
            <div class="avatar-body"></div>
            <div class="avatar-face"><span class="avatar-smile"></span></div>
            <img class="avatar-photo" id="avatarPhoto" alt="上傳的角色照片">
          </div>
        </div>

        <div class="focus-pill" aria-label="專注計時器">
          <span class="timer" id="timer">25:00</span>
          <button class="icon-btn primary" id="toggleTimer" title="開始或暫停">▶</button>
          <button class="icon-btn" id="resetTimer" title="重設">↺</button>
        </div>
      </div>

      <aside class="side">
        <section class="panel upload">
          <div class="panel-head">
            <h2 class="panel-title">角色圖片上傳</h2>
            <button class="text-btn" id="clearPhoto">清除</button>
          </div>
          <label class="drop">
            <input id="photoInput" type="file" accept="image/*">
          </label>
          <ul class="status-list">
            <li><span class="check">✓</span><span>本機預覽，不會離開瀏覽器</span></li>
            <li><span class="check">✓</span><span>自動裁成圓形頭像</span></li>
            <li><span class="check">✓</span><span id="avatarState">目前使用預設伴讀娃娃</span></li>
          </ul>
          <div class="generation-card">
            <div class="generation-top">
              <span id="generationLabel">等待上傳玩偶照片</span>
              <strong id="generationPercent">0%</strong>
            </div>
            <div class="progress" aria-label="3D 娃娃生成進度"><span id="generationBar"></span></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">P2P Tip 紙條</h2>
            <button class="text-btn" id="seedTip">抽一張</button>
          </div>
          <div class="notes" id="notes"></div>
          <form class="note-form" id="noteForm">
            <input id="noteInput" maxlength="72" autocomplete="off" placeholder="寫一張給同房同伴的 Tip">
            <button class="text-btn primary" type="submit">貼上</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">房間設定</h2>
          </div>
          <div class="settings">
            <input id="roomName" maxlength="24" value="Midnight Study Room" aria-label="房間名稱">
            <input id="minutes" type="number" min="5" max="120" step="5" value="25" aria-label="專注分鐘">
          </div>
          <div class="invite-row">
            <input id="inviteLink" readonly value="https://newworld.study/room/midnight-0427" aria-label="邀請連結">
            <button class="text-btn" id="copyInvite" type="button">複製邀請</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">開發路線</h2>
          </div>
          <ul class="roadmap">
            <li class="now">MVP：互動 3D 娃娃、角色照片貼圖、Tip 紙條、計時與邀請</li>
            <li>P2P：WebRTC room presence、即時 Tip 同步</li>
            <li>角色：圖片上傳到物件儲存、生成狀態佇列、審核與刪除</li>
            <li>房間：多人狀態、白噪音、讀書 session 紀錄</li>
          </ul>
        </section>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script>
    const storageKey = "newworld-study-room:v1";
    const avatar = document.getElementById("avatar");
    const avatarPhoto = document.getElementById("avatarPhoto");
    const avatarState = document.getElementById("avatarState");
    const generationLabel = document.getElementById("generationLabel");
    const generationPercent = document.getElementById("generationPercent");
    const generationBar = document.getElementById("generationBar");
    const notesEl = document.getElementById("notes");
    const timerEl = document.getElementById("timer");
    const minutesEl = document.getElementById("minutes");
    const roomNameEl = document.getElementById("roomName");
    const roomCodeEl = document.getElementById("roomCode");
    const inviteEl = document.getElementById("inviteLink");
    const toastEl = document.getElementById("toast");
    const dollCanvas = document.getElementById("dollCanvas");
    const avatarZone = dollCanvas.closest(".avatar-zone");

    const defaultTips = [
      { by: "Lina", text: "卡住時先把題目改寫成一句話，腦袋會安靜很多。" },
      { by: "Kai", text: "25 分鐘只開一個分頁，其他事情寫到旁邊等下一輪。" },
      { by: "Momo", text: "讀完一小節就站起來喝水，回來比較不會散掉。" }
    ];

    let state = loadState();
    let remaining = state.minutes * 60;
    let timer = null;
    let generationTimer = null;
    let dollViewer = null;

    function initDollViewer() {
      if (!window.THREE) {
        dollCanvas.hidden = true;
        return null;
      }

      const T = window.THREE;
      const renderer = new T.WebGLRenderer({ canvas: dollCanvas, alpha: true, antialias: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = T.SRGBColorSpace;

      const scene = new T.Scene();
      const camera = new T.PerspectiveCamera(32, 1, .1, 20);
      camera.position.set(0, .25, 5.2);

      const doll = new T.Group();
      doll.rotation.x = -.04;
      scene.add(doll);

      const skin = new T.MeshStandardMaterial({ color: 0xe6c9a2, roughness: .72 });
      const cloth = new T.MeshStandardMaterial({ color: 0x68c7bd, roughness: .62, metalness: .04 });
      const clothDark = new T.MeshStandardMaterial({ color: 0x477c92, roughness: .68 });
      const accent = new T.MeshStandardMaterial({ color: 0xf0b35d, roughness: .55 });
      const sole = new T.MeshStandardMaterial({ color: 0x24384a, roughness: .8 });

      const body = new T.Mesh(new T.SphereGeometry(.76, 40, 28), cloth);
      body.scale.set(.9, 1.05, .7);
      body.position.y = .02;
      doll.add(body);

      const belly = new T.Mesh(new T.SphereGeometry(.5, 32, 22), clothDark);
      belly.scale.set(1, 1.08, .36);
      belly.position.set(0, -.04, .54);
      doll.add(belly);

      const head = new T.Mesh(new T.SphereGeometry(.73, 48, 34), skin);
      head.scale.set(1, 1.03, .92);
      head.position.y = 1.12;
      doll.add(head);

      const makeLimb = (x, y, rotation, material = cloth) => {
        const limb = new T.Mesh(new T.CapsuleGeometry(.18, .46, 8, 18), material);
        limb.position.set(x, y, 0);
        limb.rotation.z = rotation;
        doll.add(limb);
      };
      makeLimb(-.73, .15, -.48);
      makeLimb(.73, .15, .48);
      makeLimb(-.35, -.82, .04, sole);
      makeLimb(.35, -.82, -.04, sole);

      const earGeometry = new T.SphereGeometry(.2, 24, 18);
      [-1, 1].forEach((side) => {
        const ear = new T.Mesh(earGeometry, accent);
        ear.position.set(side * .58, 1.63, -.05);
        ear.scale.set(1, 1.14, .65);
        doll.add(ear);
      });

      const scarf = new T.Mesh(new T.TorusGeometry(.47, .09, 12, 40), accent);
      scarf.rotation.x = Math.PI / 2;
      scarf.position.set(0, .57, .06);
      doll.add(scarf);

      const faceCanvas = document.createElement("canvas");
      faceCanvas.width = faceCanvas.height = 512;
      const faceContext = faceCanvas.getContext("2d");
      faceContext.fillStyle = "#f2d7b6";
      faceContext.fillRect(0, 0, 512, 512);
      faceContext.fillStyle = "#30261f";
      faceContext.beginPath();
      faceContext.arc(166, 235, 22, 0, Math.PI * 2);
      faceContext.arc(346, 235, 22, 0, Math.PI * 2);
      faceContext.fill();
      faceContext.lineWidth = 18;
      faceContext.lineCap = "round";
      faceContext.beginPath();
      faceContext.arc(256, 292, 85, .25, Math.PI - .25);
      faceContext.stroke();

      const defaultFaceTexture = new T.CanvasTexture(faceCanvas);
      defaultFaceTexture.colorSpace = T.SRGBColorSpace;
      const faceMaterial = new T.MeshBasicMaterial({ map: defaultFaceTexture, transparent: true });
      const face = new T.Mesh(new T.CircleGeometry(.575, 64), faceMaterial);
      face.position.set(0, 1.12, .675);
      doll.add(face);

      const scanMaterial = new T.MeshBasicMaterial({ color: 0xffe1a7, transparent: true, opacity: .75 });
      const scanRing = new T.Mesh(new T.TorusGeometry(.92, .025, 8, 64), scanMaterial);
      scanRing.rotation.x = Math.PI / 2;
      scanRing.visible = false;
      doll.add(scanRing);

      const pedestal = new T.Mesh(
        new T.CylinderGeometry(.82, .94, .16, 48),
        new T.MeshStandardMaterial({ color: 0x5a3828, roughness: .76 })
      );
      pedestal.position.y = -1.22;
      scene.add(pedestal);

      scene.add(new T.HemisphereLight(0xffe1a7, 0x172437, 2.15));
      const keyLight = new T.DirectionalLight(0xffd79a, 2.6);
      keyLight.position.set(2.5, 4, 4);
      scene.add(keyLight);
      const rimLight = new T.PointLight(0x68c7bd, 2.2, 8);
      rimLight.position.set(-2.4, 1.5, 2);
      scene.add(rimLight);

      let photoTexture = null;
      let currentPhoto = null;
      let dragging = false;
      let pointerX = 0;
      let targetRotation = 0;

      function setPhoto(dataUrl) {
        if (dataUrl === currentPhoto) return;
        currentPhoto = dataUrl;
        if (!dataUrl) {
          if (photoTexture) photoTexture.dispose();
          photoTexture = null;
          faceMaterial.map = defaultFaceTexture;
          faceMaterial.needsUpdate = true;
          return;
        }
        const image = new Image();
        image.onload = () => {
          const crop = document.createElement("canvas");
          crop.width = crop.height = 512;
          const context = crop.getContext("2d");
          const size = Math.min(image.naturalWidth, image.naturalHeight);
          const sx = (image.naturalWidth - size) / 2;
          const sy = (image.naturalHeight - size) / 2;
          context.drawImage(image, sx, sy, size, size, 0, 0, 512, 512);
          if (photoTexture) photoTexture.dispose();
          photoTexture = new T.CanvasTexture(crop);
          photoTexture.colorSpace = T.SRGBColorSpace;
          faceMaterial.map = photoTexture;
          faceMaterial.needsUpdate = true;
        };
        image.src = dataUrl;
      }

      function setGeneration(status) {
        scanRing.visible = status === "generating";
      }

      function resize() {
        const width = Math.max(1, avatarZone.clientWidth);
        const height = Math.max(1, avatarZone.clientHeight);
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      dollCanvas.addEventListener("pointerdown", (event) => {
        dragging = true;
        pointerX = event.clientX;
        dollCanvas.setPointerCapture(event.pointerId);
      });
      dollCanvas.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        targetRotation += (event.clientX - pointerX) * .018;
        pointerX = event.clientX;
      });
      dollCanvas.addEventListener("pointerup", () => { dragging = false; });
      dollCanvas.addEventListener("pointercancel", () => { dragging = false; });

      const clock = new T.Clock();
      renderer.setAnimationLoop(() => {
        const elapsed = clock.getElapsedTime();
        if (!dragging) targetRotation = Math.sin(elapsed * .45) * .16;
        doll.rotation.y += (targetRotation - doll.rotation.y) * .08;
        doll.position.y = Math.sin(elapsed * 1.8) * .035;
        if (scanRing.visible) {
          scanRing.position.y = Math.sin(elapsed * 2.7) * 1.15 + .18;
          scanMaterial.opacity = .45 + Math.sin(elapsed * 5) * .2;
        }
        renderer.render(scene, camera);
      });

      new ResizeObserver(resize).observe(avatarZone);
      resize();
      avatarZone.classList.add("viewer-ready");
      return { setPhoto, setGeneration };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        return {
          roomName: saved?.roomName || "Midnight Study Room",
          minutes: Number(saved?.minutes) || 25,
          photo: saved?.photo || "",
          generation: saved?.generation || (saved?.photo ? "ready" : "empty"),
          generationProgress: Number(saved?.generationProgress) || (saved?.photo ? 100 : 0),
          tips: Array.isArray(saved?.tips) && saved.tips.length ? saved.tips : defaultTips
        };
      } catch {
        return { roomName: "Midnight Study Room", minutes: 25, photo: "", generation: "empty", generationProgress: 0, tips: defaultTips };
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function renderAll() {
      roomNameEl.value = state.roomName;
      minutesEl.value = state.minutes;
      updateRoomCode();
      renderAvatar();
      renderGeneration();
      renderTips();
      renderTimer();
      saveState();
    }

    function updateRoomCode() {
      const slug = state.roomName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "study-room";
      const short = slug.slice(0, 18);
      roomCodeEl.textContent = `room://${short}-0427`;
      inviteEl.value = `https://newworld.study/room/${short}-0427`;
    }

    function renderAvatar() {
      if (state.photo) {
        avatar.classList.add("has-photo");
        avatarPhoto.src = state.photo;
        avatarState.textContent = state.generation === "ready" ? "3D 娃娃已放進小木屋伴讀" : "正在用照片產出 3D 娃娃";
      } else {
        avatar.classList.remove("has-photo");
        avatarPhoto.removeAttribute("src");
        avatarState.textContent = "目前使用預設伴讀娃娃";
      }
      avatar.classList.toggle("generated", state.generation === "ready");
      avatar.classList.toggle("generating", state.generation === "generating");
      dollViewer?.setPhoto(state.photo);
      dollViewer?.setGeneration(state.generation);
    }

    function renderGeneration() {
      generationBar.style.setProperty("--progress", `${state.generationProgress || 0}%`);
      generationPercent.textContent = `${state.generationProgress || 0}%`;
      if (state.generation === "ready") {
        generationLabel.textContent = "3D 娃娃已完成";
      } else if (state.generation === "generating") {
        generationLabel.textContent = "正在產出 3D 娃娃";
      } else {
        generationLabel.textContent = "等待上傳玩偶照片";
      }
    }

    function beginGeneration() {
      window.clearInterval(generationTimer);
      state.generation = "generating";
      state.generationProgress = 12;
      renderAll();
      generationTimer = window.setInterval(() => {
        state.generationProgress = Math.min(100, state.generationProgress + 22);
        if (state.generationProgress >= 100) {
          state.generation = "ready";
          window.clearInterval(generationTimer);
          showToast("3D 娃娃已完成，正在小木屋陪你讀書。");
        }
        renderAll();
      }, 420);
    }

    function renderTips() {
      notesEl.innerHTML = "";
      state.tips.slice(0, 7).forEach((tip) => {
        const note = document.createElement("article");
        note.className = "note";
        const by = document.createElement("b");
        by.textContent = tip.by;
        const text = document.createElement("span");
        text.textContent = tip.text;
        note.append(by, text);
        notesEl.appendChild(note);
      });
    }

    function renderTimer() {
      const min = Math.floor(remaining / 60).toString().padStart(2, "0");
      const sec = Math.floor(remaining % 60).toString().padStart(2, "0");
      timerEl.textContent = `${min}:${sec}`;
    }

    function resetTimer() {
      stopTimer();
      remaining = Math.max(5, Math.min(120, Number(minutesEl.value) || state.minutes)) * 60;
      renderTimer();
    }

    function startTimer() {
      if (timer) return;
      document.getElementById("toggleTimer").textContent = "Ⅱ";
      timer = window.setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        renderTimer();
        if (remaining === 0) {
          stopTimer();
          showToast("這輪完成了。貼一張 Tip 給下一個進房的人吧。");
        }
      }, 1000);
    }

    function stopTimer() {
      window.clearInterval(timer);
      timer = null;
      document.getElementById("toggleTimer").textContent = "▶";
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      window.clearTimeout(showToast.t);
      showToast.t = window.setTimeout(() => toastEl.classList.remove("show"), 2400);
    }

    document.getElementById("photoInput").addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("請選擇圖片檔。");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        state.photo = String(reader.result);
        beginGeneration();
        showToast("已收到照片，開始生成 3D 娃娃。");
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("clearPhoto").addEventListener("click", () => {
      state.photo = "";
      state.generation = "empty";
      state.generationProgress = 0;
      window.clearInterval(generationTimer);
      document.getElementById("photoInput").value = "";
      renderAll();
      showToast("已回到預設伴讀娃娃。");
    });

    document.getElementById("noteForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.getElementById("noteInput");
      const text = input.value.trim();
      if (!text) return;
      state.tips.unshift({ by: "You", text });
      input.value = "";
      renderAll();
      showToast("Tip 已貼到房間牆上。");
    });

    document.getElementById("seedTip").addEventListener("click", () => {
      const samples = [
        "下一輪開始前，先寫下唯一要完成的最小步驟。",
        "把手機放到看不見的地方，專注值會立刻多一格。",
        "遇到難題就留一個問題句，不要留一團焦慮。"
      ];
      state.tips.unshift({ by: "P2P", text: samples[Math.floor(Math.random() * samples.length)] });
      renderAll();
    });

    document.getElementById("toggleTimer").addEventListener("click", () => {
      if (timer) stopTimer();
      else startTimer();
    });

    document.getElementById("resetTimer").addEventListener("click", resetTimer);

    minutesEl.addEventListener("change", () => {
      state.minutes = Math.max(5, Math.min(120, Number(minutesEl.value) || 25));
      minutesEl.value = state.minutes;
      resetTimer();
      renderAll();
    });

    roomNameEl.addEventListener("input", () => {
      state.roomName = roomNameEl.value.trim() || "Study Room";
      renderAll();
    });

    document.getElementById("copyInvite").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(inviteEl.value);
        showToast("邀請連結已複製。");
      } catch {
        inviteEl.select();
        showToast("已選取邀請連結。");
      }
    });

    dollViewer = initDollViewer();
    renderAll();
  </script>
</body>
</html>
