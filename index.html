<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101823" />
    <meta name="description" content="一間有 3D 娃娃陪伴、能互傳 Tip 紙條的線上伴讀小木屋。" />
    <title>NewWorld Study Room</title>
    <link rel="icon" href="icon-192.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.svg" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <h1>NewWorld Study Room</h1>
          <span class="room-code" id="roomCode">正在建立房間</span>
        </div>
        <div class="room-actions">
          <div class="presence" aria-live="polite">
            <span class="dot" id="presenceDot"></span>
            <span id="presenceText">連線準備中</span>
          </div>
          <button
            class="icon-btn subtle"
            id="toggleAtmosphere"
            type="button"
            aria-label="切換晝夜氛圍"
            title="切換晝夜氛圍（自動/白晝/黃昏/子夜）"
          >
            <i data-lucide="sun-moon"></i>
          </button>
          <button
            class="icon-btn subtle"
            id="toggleZen"
            type="button"
            aria-label="極簡禪意模式"
            title="進入極簡禪意專注全螢幕（快捷鍵：Z）"
          >
            <i data-lucide="maximize-2"></i>
          </button>
          <button
            class="icon-btn share-room"
            id="shareRoom"
            type="button"
            aria-label="分享房間"
            title="分享房間"
            disabled
          >
            <i data-lucide="share-2"></i>
          </button>
        </div>
      </header>

      <section class="shell" aria-label="伴讀小木屋">
        <section class="stage" id="roomStage" aria-label="3D 伴讀房">
          <div class="stars" aria-hidden="true"></div>
          <div class="tip-meteor" id="tipMeteor" aria-hidden="true" hidden></div>
          <div class="peer-status-bar" id="peerStatusBar" hidden>
            <span id="peerStatusText">夥伴正在專注中...</span>
          </div>
          <div class="celebrate-banner" id="celebrateBanner" hidden>
            <span id="celebrateText">🎉 夥伴送來了掌聲喝采！</span>
          </div>
          <button
            class="tip-signal"
            id="tipSignal"
            type="button"
            aria-label="查看新收到的 Tip"
            title="查看新收到的 Tip"
            hidden
          >
            <i data-lucide="message-circle-heart"></i>
            <span class="tip-signal-count" id="tipSignalCount">1</span>
          </button>
          <div class="room-3d" aria-hidden="true">
            <div class="cabin-roof"></div>
            <div class="cabin-sign">小木屋伴讀中</div>
            <div class="room-box">
              <div class="window" id="cabinWindow">
                <canvas class="window-rain" id="windowRain" width="88" height="96"></canvas>
                <span id="windowCelestial" title="點擊切換晝夜氛圍"></span>
              </div>
              <div class="beam beam-v"></div>
              <div class="beam beam-h"></div>
              <div class="floor"></div>
              <div class="desk"></div>
              <div class="lamp"></div>
              <div class="bookshelf">
                <div><span></span><span></span><span></span><span></span></div>
                <div><span></span><span></span><span></span><span></span></div>
                <div><span></span><span></span><span></span><span></span></div>
              </div>
              <div class="plant"></div>
            </div>
          </div>

          <div class="focus-garden" id="focusGarden" data-plant="rose" aria-label="專注植物：玫瑰，種子階段">
            <div class="garden-plant" aria-hidden="true">
              <span class="garden-seed"></span>
              <div class="flower-form">
                <span class="flower-stem"></span>
                <span class="flower-leaf flower-leaf-left"></span>
                <span class="flower-leaf flower-leaf-right"></span>
                <span class="flower-bloom"><i></i><i></i><i></i><i></i><i></i></span>
              </div>
              <div class="cactus-form">
                <span class="cactus-body"></span>
                <span class="cactus-arm cactus-arm-left"></span>
                <span class="cactus-arm cactus-arm-right"></span>
                <span class="cactus-flower"></span>
              </div>
              <div class="succulent-form"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <div class="pine-form">
                <span class="pine-trunk"></span>
                <span class="pine-tier pine-tier-one"></span>
                <span class="pine-tier pine-tier-two"></span>
                <span class="pine-tier pine-tier-three"></span>
              </div>
            </div>
            <span class="garden-ground" aria-hidden="true"></span>
            <span class="garden-status" id="gardenStatus" aria-live="polite">玫瑰 · 種子</span>
            <button
              class="herbarium-btn"
              id="openHerbarium"
              type="button"
              aria-label="打開植物溫室圖鑑"
              title="查看植物溫室圖鑑與成就徽章"
            >
              <i data-lucide="book-open"></i>
              <span>圖鑑</span>
            </button>
          </div>

          <div class="avatar-zone" id="avatarZone">
            <div class="sleep-bubble" id="sleepBubble" hidden aria-hidden="true">
              <span>Z</span><span>z</span><span>z</span>
            </div>
            <div class="pet-hearts" id="petHearts" aria-hidden="true"></div>
            <div class="floating-reactions" id="floatingReactions" aria-hidden="true"></div>
            <div class="companion-bubble" id="companionBubble" aria-live="polite">
              <span class="bubble-text" id="bubbleText"></span>
            </div>
            <canvas class="doll-canvas" id="dollCanvas" aria-label="可旋轉與互動的 3D 伴讀娃娃"></canvas>
            <div class="avatar-fallback" id="avatarFallback" aria-hidden="true">
              <div class="fallback-head">•‿•</div>
              <div class="fallback-body"></div>
            </div>
          </div>

          <div class="focus-bar">
            <span class="timer" id="timer">25:00</span>
            <button class="icon-btn primary" id="toggleTimer" type="button" aria-label="開始專注" title="開始專注">
              <i data-lucide="play"></i>
            </button>
            <button class="icon-btn" id="resetTimer" type="button" aria-label="重設計時" title="重設計時">
              <i data-lucide="rotate-ccw"></i>
            </button>
            <button class="icon-btn" id="toggleMusic" type="button" aria-label="播放背景音樂" title="播放背景音樂">
              <i data-lucide="music-2"></i>
            </button>
            <button
              class="icon-btn"
              id="toggleAmbient"
              type="button"
              aria-label="切換白噪音面板"
              title="切換白噪音面板"
            >
              <i data-lucide="cloud-rain"></i>
            </button>
            <button
              class="icon-btn"
              id="sendCheer"
              type="button"
              aria-label="為夥伴喝采"
              title="為同房夥伴送上拍手喝采"
            >
              <i data-lucide="hand-metal"></i>
            </button>
            <div class="peer-reaction-tray" id="peerReactionTray" aria-label="同房夥伴互動表情">
              <button class="reaction-chip" type="button" data-reaction="💡" title="送出靈感 💡">💡</button>
              <button class="reaction-chip" type="button" data-reaction="🔥" title="送出熱血 🔥">🔥</button>
              <button class="reaction-chip" type="button" data-reaction="☕" title="送出休息 ☕">☕</button>
              <button class="reaction-chip" type="button" data-reaction="✨" title="送出閃耀 ✨">✨</button>
              <button class="reaction-chip" type="button" data-reaction="💯" title="送出滿分 💯">💯</button>
            </div>
          </div>

          <div class="ambient-bar" id="ambientBar" hidden>
            <div class="ambient-presets">
              <span class="ambient-preset-title">場景預設：</span>
              <button class="preset-btn" type="button" data-preset="cozy_fireplace">🌧️ 雨夜壁爐</button>
              <button class="preset-btn" type="button" data-preset="forest_breeze">🌲 林間微風</button>
              <button class="preset-btn" type="button" data-preset="deep_flow">🧘 深度心流</button>
              <button class="preset-btn" type="button" data-preset="study_library">📚 圖書館自習</button>
            </div>
            <div class="ambient-chips">
              <button class="ambient-chip" type="button" data-sound="rain" aria-pressed="false">
                <i data-lucide="cloud-rain"></i>
                <span>雨聲</span>
              </button>
              <button class="ambient-chip" type="button" data-sound="wind" aria-pressed="false">
                <i data-lucide="wind"></i>
                <span>微風</span>
              </button>
              <button class="ambient-chip" type="button" data-sound="campfire" aria-pressed="false">
                <i data-lucide="flame"></i>
                <span>營火</span>
              </button>
              <button class="ambient-chip" type="button" data-sound="brown_noise" aria-pressed="false">
                <i data-lucide="waves"></i>
                <span>潮汐</span>
              </button>
              <button class="ambient-chip" type="button" data-sound="keyboard" aria-pressed="false">
                <i data-lucide="keyboard"></i>
                <span>機械鍵盤</span>
              </button>
              <button class="ambient-chip" type="button" data-sound="pencil" aria-pressed="false">
                <i data-lucide="pencil"></i>
                <span>鉛筆書寫</span>
              </button>
              <button class="ambient-chip" type="button" data-sound="lofi" id="lofiChip" aria-pressed="false">
                <i data-lucide="music"></i>
                <span>Lo-Fi琴弦</span>
              </button>
              <button class="ambient-chip" type="button" data-sound="binaural_alpha" aria-pressed="false">
                <i data-lucide="sparkles"></i>
                <span>Alpha波</span>
              </button>
              <button class="ambient-chip" type="button" data-sound="binaural_gamma" aria-pressed="false">
                <i data-lucide="zap"></i>
                <span>Gamma波</span>
              </button>
            </div>
            <div class="ambient-volume-row">
              <span class="ambient-label">白噪音量</span>
              <input id="ambientVolume" type="range" min="0" max="100" step="1" value="40" aria-label="白噪音音量" />
              <output id="ambientVolumeValue" for="ambientVolume">40%</output>
            </div>
          </div>
        </section>

        <aside class="sidebar">
          <section class="panel upload-panel" id="dollPanel">
            <div class="panel-head">
              <h2 id="companionPanelTitle">照片伴讀夥伴</h2>
              <button class="icon-btn subtle" id="clearPhoto" type="button" aria-label="移除照片" title="移除照片">
                <i data-lucide="trash-2"></i>
              </button>
            </div>
            <label class="drop" id="photoDrop">
              <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" />
              <i data-lucide="image-plus"></i>
              <strong>選擇角色照片</strong>
              <span>JPG、PNG 或 WebP，最大 10 MB</span>
            </label>
            <div class="style-switch companion-switch" role="group" aria-label="伴讀夥伴形式">
              <button class="style-option active" type="button" data-companion-mode="doll" aria-pressed="true">
                <i data-lucide="cuboid"></i>
                <span>3D 公仔</span>
              </button>
              <button class="style-option" type="button" data-companion-mode="standee" aria-pressed="false">
                <i data-lucide="panel-top"></i>
                <span>照片立牌</span>
              </button>
            </div>
            <div class="style-switch" id="dollStyleSwitch" role="group" aria-label="公仔造型">
              <button class="style-option active" type="button" data-doll-style="cozy" aria-pressed="true">
                <i data-lucide="sparkles"></i>
                <span>暖心公仔</span>
              </button>
              <button class="style-option" type="button" data-doll-style="detective" aria-pressed="false">
                <i data-lucide="search"></i>
                <span>推理 Q 版</span>
              </button>
              <button class="style-option" type="button" data-doll-style="wizard" aria-pressed="false">
                <i data-lucide="wand-2"></i>
                <span>魔法學者</span>
              </button>
            </div>
            <div class="accessory-switch" id="accessorySwitch" role="group" aria-label="玩偶配件">
              <button
                class="accessory-chip"
                type="button"
                data-accessory="glasses"
                aria-pressed="false"
                title="復古金框眼鏡"
              >
                <i data-lucide="glasses"></i>
                <span>眼鏡</span>
              </button>
              <button class="accessory-chip" type="button" data-accessory="crown" aria-pressed="false" title="學霸金冠">
                <i data-lucide="crown"></i>
                <span>金冠</span>
              </button>
              <button
                class="accessory-chip"
                type="button"
                data-accessory="coffee"
                aria-pressed="false"
                title="暖心熱咖啡"
              >
                <i data-lucide="coffee"></i>
                <span>咖啡</span>
              </button>
              <button class="accessory-chip" type="button" data-accessory="cat" aria-pressed="false" title="伴讀小貓">
                <i data-lucide="cat"></i>
                <span>小貓</span>
              </button>
            </div>
            <div class="generation-card">
              <div class="generation-top">
                <span id="generationLabel">等待上傳照片</span>
                <strong id="generationPercent">0%</strong>
              </div>
              <div
                class="progress"
                role="progressbar"
                aria-label="照片材質處理進度"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <span id="generationBar"></span>
              </div>
            </div>
          </section>

          <section class="panel tip-panel" id="tipPanel">
            <div class="panel-head">
              <h2>P2P Tip 紙條</h2>
              <button class="icon-btn subtle" id="seedTip" type="button" aria-label="抽一張 Tip" title="抽一張 Tip">
                <i data-lucide="shuffle"></i>
              </button>
            </div>
            <div class="notes" id="notes" aria-live="polite"></div>
            <form class="note-form" id="noteForm">
              <input
                id="noteInput"
                maxlength="72"
                autocomplete="off"
                placeholder="寫一張給同房夥伴的 Tip"
                aria-label="Tip 內容"
              />
              <button class="icon-btn primary" type="submit" aria-label="送出 Tip" title="送出 Tip">
                <i data-lucide="send"></i>
              </button>
            </form>
          </section>

          <section class="panel task-panel" id="taskPanel">
            <div class="panel-head">
              <h2>伴讀待辦清單</h2>
              <span class="task-summary-badge" id="taskSummaryBadge">0/0</span>
            </div>
            <form class="task-form" id="taskForm">
              <input
                id="taskInput"
                maxlength="40"
                placeholder="新增今日專注任務..."
                autocomplete="off"
                aria-label="待辦任務名稱"
              />
              <select
                id="taskTargetPomo"
                class="task-target-select"
                title="預估目標番茄鐘數"
                aria-label="預估目標番茄鐘數"
              >
                <option value="1">1 🍅</option>
                <option value="2" selected>2 🍅</option>
                <option value="3">3 🍅</option>
                <option value="4">4 🍅</option>
                <option value="5">5 🍅</option>
              </select>
              <button class="icon-btn primary" type="submit" aria-label="新增任務" title="新增任務">
                <i data-lucide="plus"></i>
              </button>
            </form>
            <div class="task-list" id="taskList" aria-live="polite"></div>
          </section>

          <section class="panel stats-panel" id="statsPanel">
            <div class="panel-head">
              <h2>專注里程碑</h2>
              <span class="streak-badge" id="streakBadge" title="連續專注天數">🔥 0 天連續</span>
            </div>
            <div class="stats-grid">
              <div class="stat-card">
                <span class="stat-number" id="statTodayMinutes">0</span>
                <span class="stat-caption">今日專注 (分)</span>
              </div>
              <div class="stat-card">
                <span class="stat-number" id="statTotalHours">0</span>
                <span class="stat-caption">累計時數 (時)</span>
              </div>
              <div class="stat-card">
                <span class="stat-number" id="statCompletedSessions">0</span>
                <span class="stat-caption">完成番茄輪次</span>
              </div>
              <div class="stat-card">
                <span class="stat-number" id="statTotalHarvest">0</span>
                <span class="stat-caption">收穫植物數</span>
              </div>
            </div>
            <div class="heatmap-section" id="heatmapSection" data-theme="emerald">
              <div class="heatmap-head">
                <div class="heatmap-title-col">
                  <span id="heatmapTitle">專注熱力圖</span>
                  <span class="heatmap-range-label" id="heatmapRangeLabel">近 28 天</span>
                </div>
                <div class="heatmap-nav-group">
                  <button
                    class="heatmap-nav-btn"
                    id="heatmapPrev"
                    type="button"
                    title="前一期 (28天)"
                    aria-label="前一期"
                  >
                    <i data-lucide="chevron-left"></i>
                  </button>
                  <button class="heatmap-nav-btn text-nav" id="heatmapReset" type="button" title="回到當期">
                    當期
                  </button>
                  <button
                    class="heatmap-nav-btn"
                    id="heatmapNext"
                    type="button"
                    title="後一期 (28天)"
                    aria-label="後一期"
                  >
                    <i data-lucide="chevron-right"></i>
                  </button>
                </div>
              </div>
              <div class="heatmap-subbar">
                <div class="heatmap-theme-picker" id="heatmapThemeChips">
                  <span class="theme-label">主題：</span>
                  <button class="theme-chip active" type="button" data-theme="emerald" title="翡翠綠">綠</button>
                  <button class="theme-chip" type="button" data-theme="amber" title="金秋橙">橙</button>
                  <button class="theme-chip" type="button" data-theme="cyber" title="霓虹紫">紫</button>
                  <button class="theme-chip" type="button" data-theme="ocean" title="海琉藍">藍</button>
                </div>
                <span class="heatmap-legend" aria-hidden="true">
                  <span class="heat-box level-0" title="0分"></span>
                  <span class="heat-box level-1" title="1-25分"></span>
                  <span class="heat-box level-2" title="26-60分"></span>
                  <span class="heat-box level-3" title="61-120分"></span>
                  <span class="heat-box level-4" title="120+分"></span>
                </span>
              </div>
              <div class="heatmap-grid" id="heatmapGrid" aria-label="專注熱力圖"></div>
            </div>
            <div class="stats-export-row">
              <button class="stats-action-btn" id="copyMarkdownLog" type="button" title="複製今日專注 Markdown 日誌">
                <i data-lucide="clipboard-copy"></i>
                <span>複製 Markdown 日誌</span>
              </button>
              <button class="stats-action-btn" id="exportBackupJson" type="button" title="匯出學習歷史 JSON 備份檔">
                <i data-lucide="download"></i>
                <span>匯出備份</span>
              </button>
            </div>
          </section>

          <section class="panel settings-panel">
            <div class="panel-head">
              <h2>房間設定</h2>
              <span class="role-badge" id="roleBadge">本機</span>
            </div>
            <label class="field">
              <span>房間名稱</span>
              <input id="roomName" maxlength="24" value="Midnight Study Room" />
            </label>
            <label class="field">
              <span>顯示名稱</span>
              <input id="nickname" maxlength="18" value="夥伴" autocomplete="nickname" />
            </label>
            <label class="field">
              <span>專注分鐘</span>
              <input id="minutes" type="number" min="5" max="120" step="5" value="25" />
            </label>
            <label class="field">
              <span>專注植物</span>
              <select id="plantType">
                <option value="rose">玫瑰</option>
                <option value="tulip">鬱金香</option>
                <option value="cactus">仙人掌</option>
                <option value="succulent">多肉植物</option>
                <option value="pine">松樹</option>
              </select>
            </label>
            <label class="field volume-field">
              <span>音樂音量</span>
              <span class="range-control">
                <input id="musicVolume" type="range" min="0" max="100" step="1" value="28" />
                <output id="musicVolumeValue" for="musicVolume">28%</output>
              </span>
            </label>
            <div class="field notification-field">
              <span>桌面通知</span>
              <div class="notification-control">
                <button class="notification-btn" id="toggleNotification" type="button" aria-label="切換桌面通知">
                  <i data-lucide="bell" id="notificationIcon"></i>
                  <span id="notificationBtnText">開啟桌面通知</span>
                </button>
              </div>
            </div>
            <div class="invite-row">
              <input id="inviteLink" readonly value="正在建立邀請連結" aria-label="邀請連結" />
              <button
                class="icon-btn"
                id="copyInvite"
                type="button"
                aria-label="複製邀請連結"
                title="複製邀請連結"
                disabled
              >
                <i data-lucide="copy"></i>
              </button>
            </div>
            <div class="connection-row">
              <p class="connection-status" id="connectionStatus">P2P 網路準備中</p>
              <button class="icon-btn subtle" id="retryConnection" type="button" aria-label="重新連線" title="重新連線">
                <i data-lucide="refresh-cw"></i>
              </button>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="手機快速導覽">
      <button type="button" data-scroll-target="roomStage" aria-label="伴讀房" title="伴讀房">
        <i data-lucide="house"></i>
      </button>
      <button type="button" data-scroll-target="taskPanel" aria-label="待辦任務" title="待辦任務">
        <i data-lucide="check-square"></i>
      </button>
      <button type="button" data-scroll-target="statsPanel" aria-label="專注里程碑" title="專注里程碑">
        <i data-lucide="bar-chart-2"></i>
      </button>
      <button type="button" data-scroll-target="tipPanel" aria-label="Tip 紙條" title="Tip 紙條">
        <i data-lucide="message-circle-heart"></i>
      </button>
      <button type="button" data-scroll-target="dollPanel" aria-label="照片娃娃" title="照片娃娃">
        <i data-lucide="image-plus"></i>
      </button>
      <button type="button" id="mobileShareRoom" aria-label="分享房間" title="分享房間" disabled>
        <i data-lucide="share-2"></i>
      </button>
    </nav>

    <button class="exit-zen-btn" id="exitZenBtn" type="button" aria-label="退出禪意模式" hidden>
      <i data-lucide="minimize-2"></i>
      <span>退出禪意 (Esc)</span>
    </button>

    <dialog class="herbarium-modal" id="herbariumModal">
      <div class="herbarium-dialog-card">
        <div class="herbarium-header">
          <div class="herbarium-title-group">
            <h2>🌿 植物溫室圖鑑與成就</h2>
            <span class="herbarium-subtitle">記錄你的每顆專注種子與心流里程</span>
          </div>
          <button class="icon-btn subtle close-btn" id="closeHerbarium" type="button" aria-label="關閉圖鑑">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="herbarium-tabs">
          <button class="tab-btn active" id="tabPlants" type="button" data-tab="plants">植物圖鑑</button>
          <button class="tab-btn" id="tabBadges" type="button" data-tab="badges">成就徽章</button>
        </div>
        <div class="herbarium-content" id="herbariumContent">
          <div class="herbarium-view plants-view" id="plantsView"></div>
          <div class="herbarium-view badges-view" id="badgesView" hidden></div>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
