<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewWorld Study Room</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0f1622;
      --bg-2: #162234;
      --panel: #18263a;
      --panel-2: #213149;
      --line: #32465f;
      --text: #ecf2f7;
      --muted: #9dadbd;
      --faint: #6f8295;
      --lamp: #f0b35d;
      --lamp-soft: #ffe1a7;
      --aqua: #68c7bd;
      --leaf: #7db36d;
      --paper: #f3e2b8;
      --paper-rose: #efc9bb;
      --ink: #312719;
      --danger: #db8c7d;
      --shadow: rgba(3, 8, 16, .38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background:
        radial-gradient(circle at 18% 6%, rgba(104, 199, 189, .16), transparent 26rem),
        linear-gradient(180deg, #0d1420 0%, var(--bg) 48%, #111b27 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.55;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1220px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 18px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0;
      line-height: 1;
    }

    .room-code {
      min-height: 30px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(24, 38, 58, .66);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      white-space: nowrap;
    }

    .presence {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--aqua);
      box-shadow: 0 0 14px rgba(104, 199, 189, .9);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      align-items: start;
    }

    .stage {
      position: relative;
      min-height: 610px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(18, 28, 42, .45), rgba(13, 18, 29, .95)),
        repeating-linear-gradient(90deg, transparent 0 72px, rgba(255, 255, 255, .018) 72px 73px);
      box-shadow: 0 22px 48px var(--shadow);
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: .7;
      background-image:
        radial-gradient(circle at 12% 18%, #dfe8f5 0 1px, transparent 2px),
        radial-gradient(circle at 28% 10%, #dfe8f5 0 1px, transparent 2px),
        radial-gradient(circle at 78% 16%, #dfe8f5 0 1px, transparent 2px),
        radial-gradient(circle at 86% 31%, #dfe8f5 0 1px, transparent 2px),
        radial-gradient(circle at 45% 24%, #dfe8f5 0 1px, transparent 2px);
    }

    .room-3d {
      position: absolute;
      left: 50%;
      bottom: 86px;
      width: min(620px, 86%);
      aspect-ratio: 1.18 / 1;
      transform: translateX(-50%);
      perspective: 980px;
    }

    .room-box {
      position: absolute;
      inset: 12% 5% 8%;
      transform-style: preserve-3d;
      transform: rotateX(58deg) rotateZ(-38deg);
    }

    .floor {
      position: absolute;
      inset: 34% 5% 6%;
      border: 1px solid rgba(255, 225, 167, .22);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(240, 179, 93, .18), rgba(104, 199, 189, .1)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 44px),
        #33425b;
      box-shadow: 0 28px 42px rgba(0, 0, 0, .34);
    }

    .wall {
      position: absolute;
      width: 62%;
      height: 48%;
      border: 1px solid rgba(255, 225, 167, .2);
      background: linear-gradient(180deg, #2a3850, #223149);
      transform-origin: bottom;
    }

    .wall.back {
      left: 19%;
      top: 2%;
      transform: translateZ(-2px) rotateX(-90deg);
    }

    .wall.side {
      right: 5%;
      top: 24%;
      width: 28%;
      transform: rotateY(90deg) rotateX(-90deg);
      background: linear-gradient(180deg, #1e2d43, #1a283e);
    }

    .window {
      position: absolute;
      left: 20%;
      top: 18%;
      width: 28%;
      height: 34%;
      border: 3px solid #5f7892;
      border-radius: 5px;
      background: #101927;
      box-shadow: inset 0 0 28px rgba(104, 199, 189, .12);
    }

    .window::before,
    .window::after {
      content: "";
      position: absolute;
      background: #5f7892;
    }

    .window::before {
      left: 50%;
      top: 0;
      width: 3px;
      height: 100%;
    }

    .window::after {
      left: 0;
      top: 50%;
      width: 100%;
      height: 3px;
    }

    .furniture {
      position: absolute;
      transform-style: preserve-3d;
      transform: rotateZ(38deg) rotateX(-58deg);
      filter: drop-shadow(0 12px 10px rgba(0, 0, 0, .2));
    }

    .desk {
      left: 18%;
      top: 38%;
      width: 168px;
      height: 88px;
    }

    .desk::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 18px;
      width: 150px;
      height: 22px;
      border-radius: 6px;
      background: #8d6745;
    }

    .desk::after {
      content: "";
      position: absolute;
      left: 96px;
      bottom: 42px;
      width: 44px;
      height: 30px;
      border-radius: 5px;
      background: #111925;
      border: 2px solid #6a8095;
      box-shadow: 0 0 26px rgba(104, 199, 189, .3);
    }

    .lamp {
      left: 34%;
      top: 28%;
      width: 58px;
      height: 100px;
    }

    .lamp::before {
      content: "";
      position: absolute;
      left: 26px;
      top: 32px;
      width: 6px;
      height: 60px;
      background: #6b563d;
    }

    .lamp::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 12px;
      width: 42px;
      height: 28px;
      clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
      background: var(--lamp);
      box-shadow: 0 0 44px rgba(240, 179, 93, .8);
    }

    .bookshelf {
      right: 16%;
      top: 18%;
      width: 92px;
      height: 150px;
      border-radius: 5px;
      background: #6f5037;
      padding: 12px 9px;
      display: grid;
      gap: 8px;
    }

    .shelf-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: end;
      gap: 4px;
      border-bottom: 3px solid #503a2b;
    }

    .shelf-row span {
      display: block;
      min-height: 18px;
      border-radius: 2px 2px 0 0;
      background: var(--lamp);
    }

    .shelf-row span:nth-child(2n) {
      min-height: 26px;
      background: var(--aqua);
    }

    .shelf-row span:nth-child(3n) {
      min-height: 22px;
      background: var(--danger);
    }

    .plant {
      right: 10%;
      bottom: 28%;
      width: 78px;
      height: 108px;
    }

    .plant::before {
      content: "";
      position: absolute;
      left: 24px;
      bottom: 0;
      width: 34px;
      height: 30px;
      clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%);
      background: #8c684a;
    }

    .plant::after {
      content: "";
      position: absolute;
      left: 8px;
      bottom: 26px;
      width: 62px;
      height: 78px;
      background: var(--leaf);
      clip-path: polygon(50% 0, 64% 34%, 100% 24%, 73% 53%, 94% 84%, 56% 70%, 35% 100%, 34% 64%, 0 72%, 24% 42%, 6% 12%, 39% 29%);
    }

    .avatar-zone {
      position: absolute;
      left: 50%;
      bottom: 108px;
      width: 180px;
      height: 220px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      z-index: 5;
    }

    .avatar {
      position: relative;
      width: 132px;
      height: 170px;
      display: grid;
      place-items: center;
      animation: breathe 3.6s ease-in-out infinite;
    }

    .avatar-body {
      position: absolute;
      left: 24px;
      bottom: 0;
      width: 84px;
      height: 108px;
      border-radius: 40px 40px 26px 26px;
      background: linear-gradient(180deg, #6fc0b8, #4c8b99);
      border: 2px solid rgba(255, 255, 255, .16);
    }

    .avatar-face,
    .avatar-photo {
      position: absolute;
      left: 20px;
      top: 4px;
      width: 92px;
      height: 92px;
      border: 4px solid #d8c29d;
      border-radius: 50%;
      background: #f2d7b6;
      overflow: hidden;
      box-shadow: 0 12px 26px rgba(0, 0, 0, .22);
    }

    .avatar-face::before,
    .avatar-face::after {
      content: "";
      position: absolute;
      top: 42px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2f261f;
    }

    .avatar-face::before {
      left: 28px;
    }

    .avatar-face::after {
      right: 28px;
    }

    .avatar-smile {
      position: absolute;
      left: 39px;
      top: 56px;
      width: 18px;
      height: 9px;
      border-bottom: 3px solid #2f261f;
      border-radius: 0 0 16px 16px;
    }

    .avatar-photo {
      display: none;
      object-fit: cover;
    }

    .avatar.has-photo .avatar-face {
      display: none;
    }

    .avatar.has-photo .avatar-photo {
      display: block;
    }

    .focus-pill {
      position: absolute;
      left: 18px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 225, 167, .22);
      border-radius: 8px;
      background: rgba(13, 20, 32, .78);
      backdrop-filter: blur(10px);
    }

    .timer {
      min-width: 74px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 21px;
      color: var(--lamp-soft);
    }

    .icon-btn,
    .text-btn {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: var(--panel-2);
    }

    .icon-btn {
      width: 38px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .text-btn {
      padding: 0 12px;
      white-space: nowrap;
    }

    .primary {
      border-color: rgba(240, 179, 93, .68);
      color: #241604;
      background: var(--lamp);
    }

    .side {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 38, 58, .9);
      box-shadow: 0 16px 32px rgba(0, 0, 0, .16);
      padding: 14px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .panel-title {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .upload {
      display: grid;
      gap: 10px;
    }

    .drop {
      display: grid;
      place-items: center;
      min-height: 112px;
      padding: 16px;
      border: 1px dashed #57718c;
      border-radius: 8px;
      color: var(--muted);
      background: #142033;
      text-align: center;
    }

    .drop input {
      width: 100%;
      max-width: 220px;
      color: var(--muted);
    }

    .status-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 13px;
    }

    .status-list li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: center;
    }

    .check {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #112118;
      background: var(--leaf);
      font-size: 12px;
      font-weight: 800;
    }

    .notes {
      display: grid;
      gap: 9px;
      max-height: 238px;
      overflow: auto;
      padding-right: 2px;
    }

    .note {
      padding: 9px 10px;
      border-radius: 4px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 3px 0 rgba(0, 0, 0, .18);
      transform: rotate(-.4deg);
    }

    .note:nth-child(even) {
      background: var(--paper-rose);
      transform: rotate(.5deg);
    }

    .note b {
      display: block;
      margin-bottom: 2px;
      color: rgba(49, 39, 25, .68);
      font-size: 12px;
    }

    .note-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 10px;
    }

    .note-form input,
    .invite-row input,
    .settings input {
      min-width: 0;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: #121d2e;
      padding: 0 10px;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 104px;
      gap: 8px;
    }

    .invite-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 8px;
    }

    .roadmap {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 13px;
    }

    .roadmap li {
      padding-left: 13px;
      border-left: 3px solid var(--line);
    }

    .roadmap .now {
      color: var(--text);
      border-color: var(--lamp);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 32px));
      padding: 10px 14px;
      border: 1px solid rgba(255, 225, 167, .24);
      border-radius: 8px;
      color: var(--lamp-soft);
      background: rgba(13, 20, 32, .92);
      box-shadow: 0 18px 36px rgba(0, 0, 0, .3);
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @keyframes breathe {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @media (max-width: 940px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 560px;
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100vw - 20px, 1220px);
        padding-top: 14px;
      }

      .topbar,
      .brand,
      .settings,
      .invite-row {
        grid-template-columns: 1fr;
      }

      .brand {
        display: grid;
      }

      .presence {
        justify-content: flex-start;
      }

      .stage {
        min-height: 510px;
      }

      .room-3d {
        width: 96%;
        bottom: 92px;
      }

      .focus-pill {
        right: 12px;
        left: 12px;
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>NewWorld Study Room</h1>
        <span class="room-code" id="roomCode">room://midnight-0427</span>
      </div>
      <div class="presence"><span class="dot"></span><span id="presenceText">3 位同伴安靜在線</span></div>
    </header>

    <section class="shell" aria-label="伴讀房 MVP">
      <div class="stage">
        <div class="stars" aria-hidden="true"></div>
        <div class="room-3d" aria-label="3D 伴讀房">
          <div class="room-box">
            <div class="wall back"><div class="window"></div></div>
            <div class="wall side"></div>
            <div class="floor"></div>
            <div class="furniture desk"></div>
            <div class="furniture lamp"></div>
            <div class="furniture bookshelf">
              <div class="shelf-row"><span></span><span></span><span></span><span></span><span></span></div>
              <div class="shelf-row"><span></span><span></span><span></span><span></span><span></span></div>
              <div class="shelf-row"><span></span><span></span><span></span><span></span><span></span></div>
            </div>
            <div class="furniture plant"></div>
          </div>
        </div>

        <div class="avatar-zone">
          <div class="avatar" id="avatar">
            <div class="avatar-body"></div>
            <div class="avatar-face"><span class="avatar-smile"></span></div>
            <img class="avatar-photo" id="avatarPhoto" alt="上傳的角色照片">
          </div>
        </div>

        <div class="focus-pill" aria-label="專注計時器">
          <span class="timer" id="timer">25:00</span>
          <button class="icon-btn primary" id="toggleTimer" title="開始或暫停">▶</button>
          <button class="icon-btn" id="resetTimer" title="重設">↺</button>
        </div>
      </div>

      <aside class="side">
        <section class="panel upload">
          <div class="panel-head">
            <h2 class="panel-title">角色圖片上傳</h2>
            <button class="text-btn" id="clearPhoto">清除</button>
          </div>
          <label class="drop">
            <input id="photoInput" type="file" accept="image/*">
          </label>
          <ul class="status-list">
            <li><span class="check">✓</span><span>本機預覽，不會離開瀏覽器</span></li>
            <li><span class="check">✓</span><span>自動裁成圓形頭像</span></li>
            <li><span class="check">✓</span><span id="avatarState">目前使用預設伴讀娃娃</span></li>
          </ul>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">P2P Tip 紙條</h2>
            <button class="text-btn" id="seedTip">抽一張</button>
          </div>
          <div class="notes" id="notes"></div>
          <form class="note-form" id="noteForm">
            <input id="noteInput" maxlength="72" autocomplete="off" placeholder="寫一張給同房同伴的 Tip">
            <button class="text-btn primary" type="submit">貼上</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">房間設定</h2>
          </div>
          <div class="settings">
            <input id="roomName" maxlength="24" value="Midnight Study Room" aria-label="房間名稱">
            <input id="minutes" type="number" min="5" max="120" step="5" value="25" aria-label="專注分鐘">
          </div>
          <div class="invite-row">
            <input id="inviteLink" readonly value="https://newworld.study/room/midnight-0427" aria-label="邀請連結">
            <button class="text-btn" id="copyInvite" type="button">複製邀請</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">開發路線</h2>
          </div>
          <ul class="roadmap">
            <li class="now">MVP：靜態 3D 房間、角色預覽、Tip 紙條、計時與邀請</li>
            <li>P2P：WebRTC room presence、即時 Tip 同步</li>
            <li>角色：圖片上傳到物件儲存、生成狀態佇列、審核與刪除</li>
            <li>房間：多人狀態、白噪音、讀書 session 紀錄</li>
          </ul>
        </section>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const storageKey = "newworld-study-room:v1";
    const avatar = document.getElementById("avatar");
    const avatarPhoto = document.getElementById("avatarPhoto");
    const avatarState = document.getElementById("avatarState");
    const notesEl = document.getElementById("notes");
    const timerEl = document.getElementById("timer");
    const minutesEl = document.getElementById("minutes");
    const roomNameEl = document.getElementById("roomName");
    const roomCodeEl = document.getElementById("roomCode");
    const inviteEl = document.getElementById("inviteLink");
    const toastEl = document.getElementById("toast");

    const defaultTips = [
      { by: "Lina", text: "卡住時先把題目改寫成一句話，腦袋會安靜很多。" },
      { by: "Kai", text: "25 分鐘只開一個分頁，其他事情寫到旁邊等下一輪。" },
      { by: "Momo", text: "讀完一小節就站起來喝水，回來比較不會散掉。" }
    ];

    let state = loadState();
    let remaining = state.minutes * 60;
    let timer = null;

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        return {
          roomName: saved?.roomName || "Midnight Study Room",
          minutes: Number(saved?.minutes) || 25,
          photo: saved?.photo || "",
          tips: Array.isArray(saved?.tips) && saved.tips.length ? saved.tips : defaultTips
        };
      } catch {
        return { roomName: "Midnight Study Room", minutes: 25, photo: "", tips: defaultTips };
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function renderAll() {
      roomNameEl.value = state.roomName;
      minutesEl.value = state.minutes;
      updateRoomCode();
      renderAvatar();
      renderTips();
      renderTimer();
      saveState();
    }

    function updateRoomCode() {
      const slug = state.roomName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "study-room";
      const short = slug.slice(0, 18);
      roomCodeEl.textContent = `room://${short}-0427`;
      inviteEl.value = `https://newworld.study/room/${short}-0427`;
    }

    function renderAvatar() {
      if (state.photo) {
        avatar.classList.add("has-photo");
        avatarPhoto.src = state.photo;
        avatarState.textContent = "角色圖片已套用到伴讀娃娃";
      } else {
        avatar.classList.remove("has-photo");
        avatarPhoto.removeAttribute("src");
        avatarState.textContent = "目前使用預設伴讀娃娃";
      }
    }

    function renderTips() {
      notesEl.innerHTML = "";
      state.tips.slice(0, 7).forEach((tip) => {
        const note = document.createElement("article");
        note.className = "note";
        const by = document.createElement("b");
        by.textContent = tip.by;
        const text = document.createElement("span");
        text.textContent = tip.text;
        note.append(by, text);
        notesEl.appendChild(note);
      });
    }

    function renderTimer() {
      const min = Math.floor(remaining / 60).toString().padStart(2, "0");
      const sec = Math.floor(remaining % 60).toString().padStart(2, "0");
      timerEl.textContent = `${min}:${sec}`;
    }

    function resetTimer() {
      stopTimer();
      remaining = Math.max(5, Math.min(120, Number(minutesEl.value) || state.minutes)) * 60;
      renderTimer();
    }

    function startTimer() {
      if (timer) return;
      document.getElementById("toggleTimer").textContent = "Ⅱ";
      timer = window.setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        renderTimer();
        if (remaining === 0) {
          stopTimer();
          showToast("這輪完成了。貼一張 Tip 給下一個進房的人吧。");
        }
      }, 1000);
    }

    function stopTimer() {
      window.clearInterval(timer);
      timer = null;
      document.getElementById("toggleTimer").textContent = "▶";
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      window.clearTimeout(showToast.t);
      showToast.t = window.setTimeout(() => toastEl.classList.remove("show"), 2400);
    }

    document.getElementById("photoInput").addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("請選擇圖片檔。");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        state.photo = String(reader.result);
        renderAll();
        showToast("角色圖片已更新。");
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("clearPhoto").addEventListener("click", () => {
      state.photo = "";
      document.getElementById("photoInput").value = "";
      renderAll();
      showToast("已回到預設伴讀娃娃。");
    });

    document.getElementById("noteForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.getElementById("noteInput");
      const text = input.value.trim();
      if (!text) return;
      state.tips.unshift({ by: "You", text });
      input.value = "";
      renderAll();
      showToast("Tip 已貼到房間牆上。");
    });

    document.getElementById("seedTip").addEventListener("click", () => {
      const samples = [
        "下一輪開始前，先寫下唯一要完成的最小步驟。",
        "把手機放到看不見的地方，專注值會立刻多一格。",
        "遇到難題就留一個問題句，不要留一團焦慮。"
      ];
      state.tips.unshift({ by: "P2P", text: samples[Math.floor(Math.random() * samples.length)] });
      renderAll();
    });

    document.getElementById("toggleTimer").addEventListener("click", () => {
      if (timer) stopTimer();
      else startTimer();
    });

    document.getElementById("resetTimer").addEventListener("click", resetTimer);

    minutesEl.addEventListener("change", () => {
      state.minutes = Math.max(5, Math.min(120, Number(minutesEl.value) || 25));
      minutesEl.value = state.minutes;
      resetTimer();
      renderAll();
    });

    roomNameEl.addEventListener("input", () => {
      state.roomName = roomNameEl.value.trim() || "Study Room";
      renderAll();
    });

    document.getElementById("copyInvite").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(inviteEl.value);
        showToast("邀請連結已複製。");
      } catch {
        inviteEl.select();
        showToast("已選取邀請連結。");
      }
    });

    renderAll();
  </script>
</body>
</html>
